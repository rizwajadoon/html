<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-card">

            <!-- User Icon -->
            <div class="user-icon">
                👤
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join us today! Fill in the details to get started.
            </p>


            <!-- Full Name -->
            <div class="input-group">

                <label>Full Name</label>

                <div class="input-box">
                    <span>👤</span>

                    <input
                        type="text"
                        placeholder="Enter your full name"
                    >
                </div>

            </div>


            <!-- Email -->
            <div class="input-group">

                <label>Email Address</label>

                <div class="input-box">
                    <span>✉️</span>

                    <input
                        type="email"
                        placeholder="Enter your email"
                    >
                </div>

            </div>


            <!-- Password -->
            <div class="input-group">

                <label>Password</label>

                <div class="input-box">
                    <span>🔒</span>

                    <input
                        type="password"
                        placeholder="Create a password"
                    >

                    <button class="eye">👁</button>
                </div>

            </div>


            <!-- Confirm Password -->
            <div class="input-group">

                <label>Confirm Password</label>

                <div class="input-box">
                    <span>🔒</span>

                    <input
                        type="password"
                        placeholder="Confirm your password"
                    >
                </div>

            </div>


            <!-- Gender -->
            <div class="input-group">

                <label>Gender</label>

                <div class="gender">

                    <label>
                        <input type="radio" name="gender">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender">
                        Others
                    </label>

                </div>

            </div>


            <!-- Terms -->
            <div class="terms">

                <input type="checkbox" id="terms">

                <label for="terms">
                    I agree to the
                    <a href="#">terms & conditions</a>
                    and
                    <a href="#">privacy policy</a>
                </label>

            </div>


            <!-- Button -->
            <button class="signup-btn">
                Sign Up
            </button>


            <!-- Login -->
            <p class="login">
                Already have an account?
                <a href="#">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
